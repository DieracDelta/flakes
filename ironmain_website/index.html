<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IronMain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f7f2;
        --steel: #9ba4b0;
        --oxide: #ff5c1a;
        --cloud: #76e4ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 18% 22%,
            rgba(255, 92, 26, 0.2),
            transparent 28rem
          ),
          radial-gradient(
            circle at 82% 68%,
            rgba(118, 228, 255, 0.15),
            transparent 30rem
          ),
          linear-gradient(135deg, #000 0%, #060606 48%, #000 100%);
        color: var(--ink);
        font-family:
          "Space Grotesk",
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 1px,
            transparent 1px
          );
        background-size: 3.5rem 3.5rem;
        mask-image: radial-gradient(circle at center, black, transparent 72%);
      }

      .topbar {
        position: fixed;
        z-index: 2;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem clamp(1rem, 4vw, 3rem);
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.86),
          rgba(0, 0, 0, 0.38) 72%,
          transparent
        );
        backdrop-filter: blur(10px);
      }

      .topbar-brand {
        color: var(--ink);
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
      }

      .tabs {
        display: flex;
        gap: 0.35rem;
        padding: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(8, 10, 12, 0.72);
      }

      .tab {
        display: inline-flex;
        align-items: center;
        min-height: 2.15rem;
        padding: 0 0.85rem;
        border-radius: 6px;
        color: var(--steel);
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
      }

      .tab:hover,
      .tab:focus-visible {
        color: #001014;
        background: var(--cloud);
        outline: none;
      }

      main {
        width: min(92vw, 74rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: 6rem 1.25rem 2.5rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 9vw, 8.4rem);
        line-height: 0.92;
        letter-spacing: 0;
        font-weight: 700;
        text-wrap: balance;
        text-shadow:
          0 0 1.2rem rgba(118, 228, 255, 0.2),
          0 0 3rem rgba(255, 92, 26, 0.16);
      }

      .brand {
        display: block;
        color: var(--ink);
      }

      .tagline {
        display: block;
        margin-top: 0.35em;
        font-size: clamp(1.55rem, 4.1vw, 4rem);
        font-weight: 500;
        color: var(--steel);
      }

      .oxide {
        color: var(--oxide);
      }

      .cloud {
        color: var(--cloud);
      }

      .contact {
        margin: 2.25rem 0 0;
        color: var(--steel);
        font-size: clamp(1rem, 2.1vw, 1.35rem);
        font-weight: 500;
      }

      .contact a {
        color: var(--ink);
        text-decoration-color: var(--oxide);
        text-decoration-thickness: 0.12em;
        text-underline-offset: 0.22em;
      }

      .contact a:hover,
      .contact a:focus-visible {
        color: var(--cloud);
      }

      @media (max-width: 760px) {
        .topbar {
          align-items: flex-start;
          padding: 0.8rem 0.85rem;
        }

        .topbar-brand {
          min-height: 2.15rem;
          display: inline-flex;
          align-items: center;
        }

        .tabs {
          max-width: 62vw;
          overflow-x: auto;
        }

        .tab {
          white-space: nowrap;
        }

        main {
          min-height: auto;
          padding-top: 5.25rem;
        }

      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-brand" href="#top" aria-label="IronMain home"
        >IronMain</a
      >
      <nav class="tabs" aria-label="Primary">
        <a class="tab" href="/product/">Products</a>
        <a class="tab" href="mailto:justin@ironmain.dev">Contact</a>
      </nav>
    </header>
    <main>
      <section class="hero" id="top" aria-labelledby="site-title">
        <h1 id="site-title">
          <span class="brand">IronMain:</span>
          <span class="tagline"
            ><span class="oxide">Oxidizing</span> mainframes into the
            <span class="cloud">cloud</span></span
          >
        </h1>
        <p class="contact">
          Contact us:
          <a href="mailto:justin@ironmain.dev">justin@ironmain.dev</a>
        </p>
      </section>
    </main>
  </body>
</html>
