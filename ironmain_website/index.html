<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IronMain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f7f2;
        --steel: #9ba4b0;
        --oxide: #ff5c1a;
        --cloud: #76e4ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 18% 22%,
            rgba(255, 92, 26, 0.2),
            transparent 28rem
          ),
          radial-gradient(
            circle at 82% 68%,
            rgba(118, 228, 255, 0.15),
            transparent 30rem
          ),
          linear-gradient(135deg, #000 0%, #060606 48%, #000 100%);
        color: var(--ink);
        font-family:
          "Space Grotesk",
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 1px,
            transparent 1px
          );
        background-size: 3.5rem 3.5rem;
        mask-image: radial-gradient(circle at center, black, transparent 72%);
      }

      main {
        width: min(92vw, 72rem);
        padding: 4rem 1.25rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 9vw, 8.4rem);
        line-height: 0.92;
        letter-spacing: 0;
        font-weight: 700;
        text-wrap: balance;
        text-shadow:
          0 0 1.2rem rgba(118, 228, 255, 0.2),
          0 0 3rem rgba(255, 92, 26, 0.16);
      }

      .brand {
        display: block;
        color: var(--ink);
      }

      .tagline {
        display: block;
        margin-top: 0.35em;
        font-size: clamp(1.55rem, 4.1vw, 4rem);
        font-weight: 500;
        color: var(--steel);
      }

      .oxide {
        color: var(--oxide);
      }

      .cloud {
        color: var(--cloud);
      }

      .contact {
        margin: 2.25rem 0 0;
        color: var(--steel);
        font-size: clamp(1rem, 2.1vw, 1.35rem);
        font-weight: 500;
      }

      .contact a {
        color: var(--ink);
        text-decoration-color: var(--oxide);
        text-decoration-thickness: 0.12em;
        text-underline-offset: 0.22em;
      }

      .contact a:hover,
      .contact a:focus-visible {
        color: var(--cloud);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <span class="brand">IronMain:</span>
        <span class="tagline"
          ><span class="oxide">Oxidizing</span> mainframes into the
          <span class="cloud">cloud</span></span
        >
      </h1>
      <p class="contact">
        Contact us at:
        <a href="mailto:justin@ironmain.dev">justin@ironmain.dev</a>
      </p>
    </main>
  </body>
</html>
