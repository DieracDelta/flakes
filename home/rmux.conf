unbind C-b
set -g prefix C-@
set -g prefix2 C-space
set -sg escape-time 1
# bind C-b send-prefix

setw -g mode-keys vi
set -g status-keys vi

bind-key C-h swap-window -t -1
bind-key C-l swap-window -t +1

set -gq allow-passthrough on
set -gq visual-activity off
set -s set-clipboard on

# Match the effective tmux gruvbox-dark status styling. Rmux can read tmux-like
# style options, but it cannot execute the Home Manager tmux plugin.
set -g display-panes-active-colour "#d5c4a1"
set -g display-panes-colour "#3c3836"
set -g message-command-style "bg=#bdae93,fg=#3c3836"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g status-left-length 120
set -g status-left-style none
set -g status-right "#[bg=#3c3836,fg=#504945,nobold,nounderscore,noitalics]#[bg=#504945,fg=#a89984] %Y-%m-%d  %H:%M #[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836] #h"
set -g status-right-length 80
set -g status-right-style none
set -g status-style "bg=#3c3836,fg=#ebdbb2"
setw -g clock-mode-colour "#83a598"
setw -g clock-mode-style 12
setw -g pane-active-border-style "fg=#d5c4a1"
setw -g pane-border-style "fg=#3c3836"
setw -g window-active-style "bg=#282828"
setw -g window-style "bg=#282828"
setw -g window-status-activity-style "bg=#3c3836,fg=#bdae93"
setw -g window-status-bell-style "bg=#fb4934,fg=#282828"
setw -g window-status-current-format "#[bg=#fabd2f,fg=#3c3836,nobold,noitalics,nounderscore]#[bg=#fabd2f,fg=#504945] #I #[bg=#fabd2f,fg=#504945,bold] #W#{?window_zoomed_flag,*Z,} #{?window_end_flag,#[bg=#3c3836],#[bg=#3c3836]}#[fg=#fabd2f,nobold,noitalics,nounderscore]"
setw -g window-status-current-style "bg=#fabd2f,fg=#3c3836"
setw -g window-status-format "#[bg=#504945,fg=#3c3836,noitalics]#[bg=#504945,fg=#ebdbb2] #I #[bg=#504945,fg=#ebdbb2] #W #{?window_end_flag,#[bg=#3c3836],#[bg=#3c3836]}#[fg=#504945,noitalics]"
setw -g window-status-separator ''
setw -g window-status-style "bg=#fabd2f,fg=#3c3836"

# claude-tmux - TUI for managing Claude Code sessions
bind-key C display-popup -E -w 80 -h 30 "claude-tmux"
